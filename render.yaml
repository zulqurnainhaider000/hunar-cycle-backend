services:
  - type: web
    name: hunar-cycle-backend
    env: python
    buildCommand: "pip install -r requirements.txt && prisma generate && prisma db push"
    startCommand: "gunicorn --worker-class gthread --threads 4 -w 1 --bind 0.0.0.0:$PORT wsgi:app"
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hunar-cycle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: hunar-cycle-db
    plan: free
    databaseName: hunar_cycle_db
    user: hunar_admin
